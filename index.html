<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ずびずばテレポ 総合版</title>
<style>
  :root{--bg:#07111f;--panel:#0d1a2b;--panel2:#12233a;--line:rgba(143,211,255,.22);--text:#e8f1ff;--muted:#9bb0d3;--accent:#8fd3ff;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#142745,#07111f 60%);color:var(--text)}
  .wrap{max-width:1400px;margin:0 auto;padding:18px}
  .hero{background:linear-gradient(180deg,rgba(18,35,58,.92),rgba(10,22,38,.94));border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:0 20px 45px rgba(0,0,0,.3)}
  h1{font-size:28px;margin:0 0 8px}
  .sub{color:var(--muted);margin:0 0 14px;line-height:1.55}
  .controls{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
  @media(max-width:900px){.controls{grid-template-columns:1fr}}
  .group{background:rgba(8,18,33,.78);border:1px solid var(--line);border-radius:16px;padding:12px}
  .label{font-size:13px;color:var(--muted);margin-bottom:10px;font-weight:700;letter-spacing:.03em}
  .btns{display:flex;flex-wrap:wrap;gap:10px}
  button.switch{appearance:none;border:none;border-radius:12px;padding:12px 16px;background:#1a2b43;color:var(--text);font-size:15px;font-weight:700;cursor:pointer;border:1px solid rgba(255,255,255,.08);transition:.15s transform,.15s background,.15s border-color}
  button.switch:hover{transform:translateY(-1px);background:#223857}
  button.switch.active{background:linear-gradient(135deg,#4aa4ff,#8f7dff);border-color:rgba(255,255,255,.2)}
  .status{margin-top:10px;color:var(--muted);font-size:14px}
  .frameWrap{margin-top:14px;background:rgba(4,12,22,.88);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-height:84vh}
  iframe{display:block;width:100%;height:84vh;border:0;background:#07111f}
</style>
</head>

<div class="wrap">

    <h1>ずびずばテレポ 総合版</h1>
    <p class="sub">フィリピン箱式 / 回転寿司式、ノーマル / ハードを切り替えられる版です。</p>

        <div class="btns">
          <button class="switch" id="stylePhil">フィリピン箱式</button>
          <button class="switch" id="styleSushi">回転寿司式</button>
        </div>
      </div>
    </div>
    <div class="frameWrap">
      <iframe id="toolFrame" title="ずびずばテレポ練習ツール"></iframe>
    </div>
  </div>
</div>

let currentStyle = localStorage.getItem('zubizubaLauncherStyle') || 'sushi';
let currentMode = localStorage.getItem('zubizubaLauncherMode') || 'normal';
const frame = document.getElementById('toolFrame');
const stylePhil = document.getElementById('stylePhil');
const styleSushi = document.getElementById('styleSushi');
const modeNormal = document.getElementById('modeNormal');
const modeHard = document.getElementById('modeHard');
const statusText = document.getElementById('statusText');
function decodeB64Utf8(b64){ const bin = atob(b64); const bytes = Uint8Array.from(bin, ch => ch.charCodeAt(0)); return new TextDecoder('utf-8').decode(bytes); }
function updateButtons(){
  stylePhil.classList.toggle('active', currentStyle === 'philippine');
  styleSushi.classList.toggle('active', currentStyle === 'sushi');
  if(modeNormal) modeNormal.classList.toggle('active', currentMode === 'normal');
  if(modeHard) modeHard.classList.toggle('active', currentMode === 'hard');
  statusText.textContent = `現在：${currentStyle === 'philippine' ? 'フィリピン箱式' : '回転寿司式'} / ${currentMode === 'normal' ? 'ノーマル' : 'ハード'}`;
}
function loadCurrentTool(){
  localStorage.setItem('zubizubaLauncherStyle', currentStyle);
  localStorage.setItem('zubizubaLauncherMode', currentMode);
  localStorage.setItem(STORAGE_KEYS[currentStyle], currentMode);
  frame.srcdoc = decodeB64Utf8(SOURCES_B64[currentStyle]);
  updateButtons();
}
stylePhil.addEventListener('click', () => { currentStyle = 'philippine'; loadCurrentTool(); });
styleSushi.addEventListener('click', () => { currentStyle = 'sushi'; loadCurrentTool(); });
if(modeNormal) modeNormal.addEventListener('click', () => { currentMode = 'normal'; loadCurrentTool(); });
if(modeHard) modeHard.addEventListener('click', () => { currentMode = 'hard'; loadCurrentTool(); });
